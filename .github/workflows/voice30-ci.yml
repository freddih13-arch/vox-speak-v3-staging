name: VOX Voice 30 — full regression
on:
  push:
    branches: [feature/voice-finish-30days]
  pull_request:
    paths:
      - 'src/core/voice-capture.js'
      - 'src/legacy/islands.js'
      - 'src/coach/coach.js'
      - 'src/phonetics/ipa-guide.js'
      - 'src/legacy/training.js'
      - 'src/ui/ipa-guide.css'
      - 'sw.js'
      - 'tests/**'
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node test suite
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Voice IPA and repeated recording
        run: python tests/voice_ipa.browser_check.py
      - name: Coach 30 mobile flow
        run: python tests/coach.browser_check.py
      - name: Listening mobile flow
        run: python tests/listening.browser_check.py
      - name: Previous speech workflows
        run: python tests/voice_browser_check.py
      - name: Phonetic exploration
        run: python tests/phonetics.browser_check.py
      - name: Speech diagnostics
        run: python tests/speech_diagnostics_browser_check.py
