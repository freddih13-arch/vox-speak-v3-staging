name: VOX 30-day Polyglot / Engineer release
on:
  push:
    branches: [feature/vox30-learning-upgrade-2026-11-09]
  pull_request:
    branches: [main]
    paths: ['src/coach/**', 'src/phonetics/ipa-guide.js', 'src/ui/coach.css', 'index.html', 'sw.js', 'tests/**']
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Native Node unit tests
        run: npm test
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Coach 30 mobile guided workflow
        run: python tests/coach.browser_check.py
      - name: Listening and repeat regression
        run: python tests/listening.browser_check.py
      - name: IPA and repeated audio capture
        run: python tests/voice_ipa.browser_check.py
      - name: Legacy voice and interview flows
        run: python tests/voice_browser_check.py
      - name: Phonetic exploration
        run: python tests/phonetics.browser_check.py
      - name: Speech diagnostics
        run: python tests/speech_diagnostics_browser_check.py
