name: VOX Coach 30 — quality gate
on:
  push:
    branches: [feature/coach30-release]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm test
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --disable-pip-version-check playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - run: python tests/coach.browser_check.py
      - run: python tests/listening.browser_check.py
      - run: python tests/voice_browser_check.py
